            featureGroup: drawnFeatures,
            remove: true

            polygon: {
                shapeOptions: {
                    color: 'purple'
                },
                //  allowIntersection: false,
                //  drawError: {
                //   color: 'orange',
                //   timeout: 1000
                //  },
            },
            polyline: {
                shapeOptions: {
                    color: 'red'
                },
            },
            rect: {
                shapeOptions: {
                    color: 'green'
                },
            },
            circle: {
                shapeOptions: {
                    color: 'steelblue'
                },
            },
        },
